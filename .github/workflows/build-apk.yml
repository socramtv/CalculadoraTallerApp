name: Build APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Descargar librerías offline (jsPDF + autotable)
        run: |
          set -e
          VENDOR_DIR=app/src/main/assets/www/vendor
          mkdir -p "$VENDOR_DIR"
          curl -fSL -o "$VENDOR_DIR/jspdf.umd.min.js" \
            https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js
          curl -fSL -o "$VENDOR_DIR/jspdf.plugin.autotable.min.js" \
            https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js
          ls -la "$VENDOR_DIR"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-taller-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
